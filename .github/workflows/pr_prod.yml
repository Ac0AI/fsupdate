name: Pull Request CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Lint 🛠️
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        uses: ./.github/actions/install-with-cache
      - name: Build project
        run: npm run build
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests 🧪
    needs:
      - build
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        uses: ./.github/actions/install-with-cache
      - name: Run tests
        run: npm run test
  trigger-tests:
    runs-on: ubuntu-latest
    env:
      E2E_REPO_PAT: ${{ secrets.PAT }}
    steps:
      - name: Trigger tests in flyttsmart-end-2-end-test repository
        id: trigger_workflow
        run: |
          repo_owner="flyttsmart"
          repo_name="flyttsmart-end-2-end-test"
          branch="main"

          if [ -z "$E2E_REPO_PAT" ]; then
            echo "::error::Repository secret PAT is missing; external E2E tests cannot be triggered."
            exit 1
          fi

          echo "🚀 Triggering tests in $repo_owner/$repo_name on branch $branch..."

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_code=$(curl -L -sS -o "$response_file" -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $E2E_REPO_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$repo_owner/$repo_name/actions/workflows/playwright.yml/dispatches \
            -d "{\"ref\": \"$branch\", \"inputs\": {\"domain\": \"mobile-flyttsmart\"}}")

          if [ "$http_code" != "204" ]; then
            echo "::error::External E2E dispatch failed with GitHub API status $http_code."
            exit 1
          fi

          echo "✅ External E2E workflow dispatch accepted."

  check-test-status:
    needs: trigger-tests
    runs-on: ubuntu-latest
    env:
      E2E_REPO_PAT: ${{ secrets.PAT }}
    steps:
      - name: Wait for Test Completion
        run: |
          repo_owner="flyttsmart"
          repo_name="flyttsmart-end-2-end-test"
          branch="main"

          if [ -z "$E2E_REPO_PAT" ]; then
            echo "::error::Repository secret PAT is missing; external E2E status cannot be read."
            exit 1
          fi

          max_retries=68  # Checks for up to 17 minutes (68 * 15 seconds). The time flyttsmart takes to run the tests.
          wait_seconds=15
          attempt=0

          while [ $attempt -lt $max_retries ]; do
            attempt=$((attempt+1))
            echo "🔄 Attempt #$attempt: Checking test status..."

            response=$(curl -fsS -H "Authorization: Bearer $E2E_REPO_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$repo_owner/$repo_name/actions/runs?branch=$branch)

            if ! echo "$response" | jq -e '.workflow_runs | type == "array"' >/dev/null; then
              echo "::error::GitHub API returned an unexpected response while reading external E2E status."
              exit 1
            fi

            # Fetching the latest and updated commit from main branch
            status=$(echo $response | jq -r '.workflow_runs[0].status')
            conclusion=$(echo $response | jq -r '.workflow_runs[0].conclusion')

            echo "🔍 Status: $status"
            echo "🔍 Conclusion: $conclusion"

            if [ "$status" == "completed" ]; then
              if [ "$conclusion" == "success" ]; then
                echo "✅ E2E tests passed!"
                exit 0
              else
                echo "❌ E2E tests failed!"
                exit 1
              fi
            elif [ "$status" == "failure" ]; then
              echo "❌ E2E tests failed!"
              exit 1
            fi

            echo "⏳ Test not completed yet, waiting $wait_seconds seconds..."
            sleep $wait_seconds
          done

          echo "❌ Timed out waiting for external E2E tests."
          exit 1
